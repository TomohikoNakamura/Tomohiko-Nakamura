<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360" role="img" aria-labelledby="title desc">
<title id="title">MangaVox — comic-style header crop</title>
<desc id="desc">Compact crop based on the MangaVox Space dev-branch header: cream paper, tilted yellow and mint manga panels, halftone dots, a comic sound effect, speech bubble, and the original dark MangaVox heading with pink offset shadow.</desc>
