<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" role="img" aria-labelledby="svg-title svg-desc">
<title id="svg-title">DDSP source-wise synthesis and mixture matching</title>
<desc id="svg-desc">Illustrative source-wise DDSP: observed audio mixture is modeled by two source synthesizers; summed outputs are matched using a spectral loss. No publication figure reproduced.</desc>
