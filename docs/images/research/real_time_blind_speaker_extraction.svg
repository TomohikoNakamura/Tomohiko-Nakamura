<title id="svg-title">Real-time blind speaker extraction</title>
<desc id="svg-desc">Original vector diagram of microphone waveforms, blockwise ILRMA estimation and framewise RCSCME speech extraction, producing an illustrative target signal. Does not reuse any IEEE Access figure.</desc>
