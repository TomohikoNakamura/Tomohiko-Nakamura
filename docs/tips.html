    (function () {
      let saved = null;
      try { saved = window.localStorage.getItem("color-theme"); } catch (_) {}
      const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      const systemDark = media ? media.matches : false;
      document.documentElement.dataset.theme = saved === "light" || saved === "dark"
        ? saved
        : (systemDark ? "dark" : "light");
    })();
  </script>

  <script>
    (function () {
      const root = document.documentElement;
      const button = document.getElementById("theme-toggle");
      const media = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
      if (!button) return;

      function savedTheme() {
        try {
          const saved = window.localStorage.getItem("color-theme");
          return saved === "light" || saved === "dark" ? saved : null;
        } catch (_) {
          return null;
        }
      }

      function updateButton() {
        const dark = root.dataset.theme === "dark";
        button.setAttribute("aria-label", dark ? "Use light theme" : "Use dark theme");
        button.setAttribute("title", dark ? "Use light theme" : "Use dark theme");
        button.setAttribute("aria-pressed", dark ? "true" : "false");
      }

      button.addEventListener("click", function () {
        const next = root.dataset.theme === "dark" ? "light" : "dark";
        root.dataset.theme = next;
        try { window.localStorage.setItem("color-theme", next); } catch (_) {}
        updateButton();
      });

      if (media) {
        media.addEventListener("change", function (event) {
          if (savedTheme() === null) {
            root.dataset.theme = event.matches ? "dark" : "light";
            updateButton();
          }
        });
      }

      updateButton();
    })();
  </script>
